[package]
name = "adbtether-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ws-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
