[package]
name = "adbtether-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "adbtether_core"
crate-type = ["cdylib"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
anyhow = "1"
wintun = "0.5"
rand = "0.8"
smoltcp = { version = "0.13", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp", "socket-udp"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
